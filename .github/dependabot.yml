version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencies]
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: "/deploy/smoke"
    schedule: { interval: weekly, day: monday }
    target-branch: develop
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
